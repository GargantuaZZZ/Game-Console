version: "4.1"
name: VSCode_test
type: ARM
deviceName: MSPM0G3507
packDir: .pack/TexasInstruments/MSPM0G1X0X_G3X0X_DFP.1.3.1
srcDirs:
  - Driver
  - User
virtualFolder:
  name: <virtual_root>
  files: []
  folders: []
dependenceList: []
outDir: build
miscInfo:
  uid: bf9ffe20e9381e261e7bf1ec805ee94b
targets:
  Debug:
    cppPreprocessAttrs:
      defineList:
        - DeviceFamily_MSPM0G350X
        - __MSPM0G3507__
      incList:
        - .
        - User
        - Driver
      libList: []
    excludeList: []
    toolchain: AC6
    toolchainConfigMap:
      AC6:
        archExtensions: ""
        cpuType: Cortex-M0+
        floatingPointHardware: none
        options:
          version: 3
          afterBuildTasks: []
          asm-compiler:
            $use: asm-auto
            misc-controls: ""
          beforeBuildTasks: []
          c/cpp-compiler:
            language-c: c99
            language-cpp: c++11
            link-time-optimization: false
            optimization: level-0
          global:
            output-debug-info: enable
            use-microLIB: false
          linker:
            $outputTaskExcludes:
              - .bin
            misc-controls: --diag_suppress=L6329
            output-format: elf
        scatterFilePath: mspm0g3507.sct
        storageLayout:
          RAM:
            - id: 1
              isChecked: true
              mem:
                size: "0x8000"
                startAddr: "0x20000000"
              noInit: false
              tag: IRAM
          ROM:
            - id: 1
              isChecked: true
              isStartup: true
              mem:
                size: "0x20000"
                startAddr: "0x08000000"
              tag: IROM
        useCustomScatterFile: true
      GCC:
        archExtensions: ""
        cpuType: Cortex-M0+
        floatingPointHardware: none
        options:
          version: 5
          afterBuildTasks: []
          asm-compiler: {}
          beforeBuildTasks: []
          c/cpp-compiler:
            language-c: c11
            language-cpp: c++11
            one-elf-section-per-data: true
            one-elf-section-per-function: true
            optimization: level-debug
            warnings: all-warnings
          global:
            $float-abi-type: hard
            misc-control: --specs=nosys.specs --specs=nano.specs
            output-debug-info: enable
          linker:
            $outputTaskExcludes:
              - .bin
            $toolName: auto
            LIB_FLAGS: -lm
            output-format: elf
            remove-unused-input-sections: true
        scatterFilePath: mspm0g3507.lds
        storageLayout:
          RAM: []
          ROM: []
        useCustomScatterFile: true
    uploadConfigMap:
      JLink:
        baseAddr: ""
        bin: ""
        cpuInfo:
          cpuName: MSPM0G3507
          vendor: TexasInstruments
        otherCmds: ""
        proType: 1
        speed: 8000
      OpenOCD:
        baseAddr: "0x08000000"
        bin: build\Debug\VSCode_test.hex
        interface: jlink
        target: ti_mspm0
      pyOCD:
        baseAddr: "0x08000000"
        bin: ""
        config: .eide/debug.pyocd.yaml
        otherCmds: ""
        speed: 4M
        targetName: cortex_m
    uploader: JLink
